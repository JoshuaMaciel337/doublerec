<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DoubleRec Studio — sem conexão</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #e4e4e7;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.875rem;
        color: #a1a1aa;
        margin: 0 0 20px;
        max-width: 22rem;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        font-weight: 600;
        font-size: 0.875rem;
        padding: 10px 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>
        O DoubleRec precisa de internet para entrar na sua conta. Reconecte e
        tente de novo.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
